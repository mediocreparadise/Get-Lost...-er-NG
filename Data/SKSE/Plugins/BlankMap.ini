; Blank Map - set a type to 1 to hide it on the world map, 0 to show it.
; This file is re-read every couple of seconds. If you also use the in-game menu
; (SKSE Menu Framework), its settings are saved to BlankMap_Menu.ini and win over this file.

[General]
LogDecisions=0

[Hide]
City=1
Town=1
Settlement=1
Cave=1
Camp=1
Fort=1
NordicRuin=1
DwemerRuin=1
Shipwreck=1
Grove=1
Landmark=1
DragonLair=1
Farm=1
WoodMill=1
Mine=1
ImperialCamp=1
StormcloakCamp=1
Doomstone=1
WheatMill=1
Smelter=1
Stable=1
ImperialTower=1
Clearing=1
Pass=1
Altar=1
Rock=1
Lighthouse=1
OrcStronghold=1
GiantCamp=1
Shack=1
NordicTower=1
NordicDwelling=1
Docks=1
Shrine=1
HoldCapitals=1
DLCMarkers=1

[Names]
; Semicolon-separated location names (case-insensitive, exact match).
; KeepLocations always show, HideLocations always hide, regardless of type.
KeepLocations=
HideLocations=

[Camera]
; Recenter=1 stops the map from opening on the player.
Recenter=1
; Mode=center -> middle of the map.  Mode=fixed -> use StartX / StartY below.
Mode=center
; World-space coordinates, used only when Mode=fixed (see BlankMap.log for bounds).
StartX=0
StartY=0

; Local map (the close-up map used in interiors). Moves its starting view off
; the player. LocalMapMode=center -> middle of the area, corner -> near its
; south-west edge.
LocalMapRecenter=1
LocalMapMode=center

[HUD]
; HideCompass=1 hides the compass. By default the compass and shout meter share
; one container, so the shout meter hides too. CompassOnly=1 tries to hide just
; the compass (experimental).
HideCompass=0
CompassOnly=0
